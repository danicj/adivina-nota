<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué nota es?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">
  <h1>¿Qué nota es esta?</h1>

  <div id="controles">
    <button id="btnSonido" onclick="toggleSonido()" title="Activar/desactivar sonido">🔊</button>
    <button id="btnTema" onclick="toggleTema()" title="Cambiar tema">🌙</button>
  </div>

  <canvas id="pentagrama" width="600" height="480"></canvas>

  <div class="botones">
    <button onclick="verificar('Do')">Do</button>
    <button onclick="verificar('Re')">Re</button>
    <button onclick="verificar('Mi')">Mi</button>
    <button onclick="verificar('Fa')">Fa</button>
    <button onclick="verificar('Sol')">Sol</button>
    <button onclick="verificar('La')">La</button>
    <button onclick="verificar('Si')">Si</button>
  </div>

  <!-- <input type="text" id="entradaNota" autocomplete="off" placeholder="Escribe una nota..." style="margin-top:10px; font-size:18px; padding:5px;"> -->

  <input type="text" id="entradaNota" autocomplete="off" style="position:absolute; top:-100px; left:-100px; opacity:0;">



  <div id="resultado"></div>

  <div id="marcadores">
    ✅ Aciertos: <span id="contadorAciertos">0</span> |
    ❌ Errores: <span id="contadorErrores">0</span> |
    ⚡ Racha: <span id="contadorRacha">0</span> |
    🏆 Mejor racha: <span id="contadorMejorRacha">0</span>
  </div>

  <button id="btnReiniciar" onclick="reiniciarMarcadores()">Reiniciar marcadores</button>

  <div id="rankingErrores">
    <h3>Notas más falladas:</h3>
    <ul id="listaErrores"></ul>
  </div>

  <div id="progreso">
    <h3>Progreso</h3>
    <div id="barrasProgreso"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
